<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FF8200">
  <meta name="reef-build" content="2026-11-10-pages">
  <title>Everleigh's Rocky Top Reef</title>
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/world.css">
  <style>html,body{margin:0;background:#062844}</style>
</head>
<body>
  <div class="top-tools">
    <button type="button" class="tool-btn" id="mic-toggle" aria-pressed="true" aria-label="Microphone is on. Tap to turn it off. Answers can still be tapped.">
      <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 11a6 6 0 0 0 12 0M12 17v3"/></svg>
      <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 11a6 6 0 0 0 12 0M12 17v3M5 5l14 14"/></svg>
    </button>
    <button type="button" class="tool-btn" id="voice-toggle" aria-pressed="true" aria-label="Sunny's voice is on. Tap to mute.">
      <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3V9z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12"/></svg>
      <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3V9z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9l5 6M21 9l-5 6"/></svg>
    </button>
    <button type="button" class="tool-btn cc-btn" id="cc-toggle" aria-pressed="true" aria-label="Captions are on. Tap to hide the words.">CC</button>
    <button type="button" class="parents-jump" id="parents-jump">Parents</button>
  </div>
  <p id="caption" class="caption-bubble" hidden></p>
  <div id="app" class="app"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
